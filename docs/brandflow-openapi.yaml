components:
  schemas:
    BriefInput:
      properties:
        topic:
          type: string
          maxLength: 500
          title: Topic
          default: ''
        brand_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Brand Id
        product_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Product Id
        target_audience:
          type: string
          maxLength: 2000
          title: Target Audience
          default: ''
        publishing_objective:
          type: string
          maxLength: 2000
          title: Publishing Objective
          default: ''
        primary_channel:
          anyOf:
          - $ref: '#/components/schemas/Channel'
          - type: 'null'
        desired_audience_action:
          type: string
          maxLength: 1000
          title: Desired Audience Action
          default: ''
      additionalProperties: false
      type: object
      title: BriefInput
    Channel:
      type: string
      enum:
      - wechat_website
      - xiaohongshu
      - video_script_60s
      - marketing_email
      title: Channel
    ChannelRevisionRequest:
      properties:
        instructions:
          items:
            type: string
          type: array
          maxItems: 20
          minItems: 1
          title: Instructions
      additionalProperties: false
      type: object
      required:
      - instructions
      title: ChannelRevisionRequest
    ClarificationRequest:
      properties:
        answers:
          additionalProperties: true
          type: object
          title: Answers
      additionalProperties: false
      type: object
      required:
      - answers
      title: ClarificationRequest
    CreateTaskRequest:
      properties:
        title:
          type: string
          maxLength: 200
          minLength: 1
          title: Title
        selected_channels:
          items:
            $ref: '#/components/schemas/Channel'
          type: array
          minItems: 1
          title: Selected Channels
        brief:
          $ref: '#/components/schemas/BriefInput'
      additionalProperties: false
      type: object
      required:
      - title
      - selected_channels
      - brief
      title: CreateTaskRequest
    DecisionRequest:
      properties:
        content_version_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Content Version Id
        target_snapshot_hash:
          type: string
          maxLength: 128
          minLength: 32
          title: Target Snapshot Hash
        decision:
          type: string
          title: Decision
        comment:
          type: string
          maxLength: 4000
          minLength: 1
          title: Comment
      additionalProperties: false
      type: object
      required:
      - target_snapshot_hash
      - decision
      - comment
      title: DecisionRequest
    ExportRequest:
      properties:
        decision_id:
          type: string
          title: Decision Id
        target_snapshot_hash:
          type: string
          maxLength: 64
          minLength: 64
