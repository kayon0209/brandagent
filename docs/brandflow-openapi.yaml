      description: Reserved for the fetch adapter; returns 501 with error code NOT_IMPLEMENTED.
      operationId: import_material_url_api_v1_consumer_materials_url_post
      security:
      - HTTPBearer: []
      parameters:
      - name: Idempotency-Key
