  /api/v1/consumer/projects/{task_id}/draft:
    get:
      summary: Get Draft
      description: Get or lazily create the live draft (revision, document, plain text).
      operationId: get_draft_api_v1_consumer_projects__task_id__draft_get
      security:
      - HTTPBearer: []
      parameters:
      - name: task_id
        in: path
        required: true
        schema:
          type: string
          title: Task Id
      responses:
        '200':
          description: Successful Response
