                $ref: '#/components/schemas/SuccessResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
    put:
      summary: Autosave Draft
      description: Revision compare-and-swap autosave; a moved server revision returns 409 REVISION_CONFLICT and the server draft is never overwritten.
      operationId: save_draft_api_v1_consumer_projects__task_id__draft_put
      security:
      - HTTPBearer: []
      parameters:
      - name: task_id
        in: path
        required: true
