  /api/v1/consumer/materials/text:
    post:
      summary: Import Material Text
      description: Import inline text material; deduplicated by content checksum and idempotent per Idempotency-Key.
      operationId: import_material_text_api_v1_consumer_materials_text_post
      security:
      - HTTPBearer: []
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 8
          maxLength: 128
          title: Idempotency-Key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - text
              properties:
                text:
                  type: string
                  minLength: 1
                  maxLength: 200000
                  title: Text
                name:
                  type: string
                  maxLength: 200
                  title: Name
      responses:
        '200':
          description: Material accepted (distilled, needs_review, duplicate, or needs_distillation)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
