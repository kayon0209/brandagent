  /api/v1/consumer/projects/{task_id}/suggestions:
    post:
      summary: Propose Selection Suggestion
      description: Propose an anchored rewrite (expand/replace_example/shorten) over the user's current selection; the model only sees the selection, its context, and linked excerpts. startOffset/endOffset are REQUIRED — they are the only anchor, so the request is rejected with 422 when they are missing, non-integer, negative, or start > end. Refuses untraceable facts with 422 SUGGESTION_REFUSED.
      operationId: propose_suggestion_api_v1_consumer_projects__task_id__suggestions_post
      security:
      - HTTPBearer: []
      parameters:
      - name: task_id
        in: path
        required: true
        schema:
          type: string
          title: Task Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - action
              - selectedText
              - blockId
              - baseRevision
              - startOffset
              - endOffset
              properties:
                action:
                  type: string
                  enum:
                  - expand
                  - replace_example
                  - shorten
                  title: Action
                selectedText:
                  type: string
                  title: Selected Text
                blockId:
                  type: string
                  title: Block Id
                startOffset:
                  type: integer
                  minimum: 0
                  title: Start Offset
                  description: Selection start offset within the block text (inclusive). Required — the offset pair is the only anchor; requests without it are rejected with 422 so duplicate text can never be mis-targeted.
                endOffset:
                  type: integer
                  minimum: 0
                  title: End Offset
                  description: Selection end offset within the block text (inclusive). Must satisfy startOffset <= endOffset.
                baseRevision:
                  type: integer
                  title: Base Revision
      responses:
        '200':
          description: Suggestion proposed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '409':
          description: Selection stale; reselect and retry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '422':
          description: Validation error or untraceable fact refused
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '502':
          description: Assist provider unavailable; the draft is unchanged
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
  /api/v1/consumer/projects/{task_id}/suggestions/{suggestion_id}/accept:
    post:
      summary: Accept Selection Suggestion
      description: Atomic accept; verifies revision, block, offsets and selection hash against the canonical server document, replaces the exact offset range, bumps the draft revision, and records a user-action event (not an enterprise approval). Legacy suggestions without a complete offset anchor return 409 SELECTION_STALE instead of guessing a position. Idempotent replays return the accepted outcome.
      operationId: accept_suggestion_api_v1_consumer_projects__task_id__suggestions__suggestion_id__accept_post
      security:
      - HTTPBearer: []
      parameters:
      - name: task_id
        in: path
        required: true
        schema:
          type: string
          title: Task Id
      - name: suggestion_id
        in: path
        required: true
        schema:
          type: string
          title: Suggestion Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - baseRevision
              properties:
                baseRevision:
                  type: integer
                  title: Base Revision
      responses:
        '200':
          description: Applied (new revision returned)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '409':
          description: Selection stale; the draft is untouched
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '404':
          description: Suggestion or draft not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
  /api/v1/consumer/projects/{task_id}/variants/preview:
    get:
      summary: Preview Platform Variants
      description: Safe C-end preview for the default channels; requires NO approval. Empty before generation; no master snapshot means the UI asks the user to adopt the draft first.
      operationId: variants_preview_api_v1_consumer_projects__task_id__variants_preview_get
      security:
      - HTTPBearer: []
      parameters:
      - name: task_id
        in: path
        required: true
        schema:
          type: string
          title: Task Id
      responses:
        '200':
          description: Preview data (never requires approval)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '404':
          description: Project not found in this workspace
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
  /api/v1/consumer/projects/{task_id}/variants/generate:
    post:
      summary: Generate Platform Variants
      description: Generate channel variants bound to the adopted master snapshot (wechat_website, xiaohongshu, video_script_60s). Idempotent per master hash + channel + prompt version; failures keep the previous version and stay retryable; unsupported factual claims reject the output.
      operationId: variants_generate_api_v1_consumer_projects__task_id__variants_generate_post
      security:
      - HTTPBearer: []
      parameters:
      - name: task_id
        in: path
        required: true
        schema:
          type: string
          title: Task Id
      responses:
        '200':
          description: Per-channel ready/failed statuses
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '404':
          description: No adopted master snapshot (adopt the draft first)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '502':
          description: Generation unavailable; previous versions kept
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
  /api/v1/consumer/projects/{task_id}/variants/{channel}/regenerate:
    post:
      summary: Regenerate One Channel Variant
      description: Adds a NEW channel version and never mutates the master; replaying the same regenerate request hits the same result.
      operationId: variants_regenerate_api_v1_consumer_projects__task_id__variants__channel__regenerate_post
      security:
      - HTTPBearer: []
      parameters:
      - name: task_id
        in: path
        required: true
        schema:
          type: string
          title: Task Id
      - name: channel
        in: path
        required: true
        schema:
          type: string
          enum:
          - wechat_website
          - xiaohongshu
          - video_script_60s
          title: Channel
      responses:
        '200':
          description: Regenerated version
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '404':
          description: No adopted master snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
  /api/v1/consumer/projects/{task_id}/export/prepare:
    post:
      summary: Prepare Export Snapshot
      description: Pins the current adopted master snapshot for export. Publishing itself stays fail-closed and still requires the MCP-side persisted high-risk authorization.
      operationId: variants_prepare_export_api_v1_consumer_projects__task_id__export_prepare_post
      security:
      - HTTPBearer: []
      parameters:
      - name: task_id
        in: path
        required: true
        schema:
          type: string
          title: Task Id
      responses:
        '200':
          description: Snapshot pinned; published=false; requires_approval_to_publish=true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '404':
          description: No adopted master snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
components:
  schemas:
    BriefInput:
      properties:
        topic:
          type: string
          maxLength: 500
          title: Topic
          default: ''
        brand_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Brand Id
        product_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Product Id
        target_audience:
          type: string
          maxLength: 2000
          title: Target Audience
          default: ''
        publishing_objective:
          type: string
          maxLength: 2000
          title: Publishing Objective
          default: ''
        primary_channel:
          anyOf:
          - $ref: '#/components/schemas/Channel'
          - type: 'null'
        desired_audience_action:
          type: string
          maxLength: 1000
          title: Desired Audience Action
          default: ''
      additionalProperties: false
      type: object
      title: BriefInput
    Channel:
      type: string
      enum:
      - wechat_website
      - xiaohongshu
      - video_script_60s
      - marketing_email
      title: Channel
    ChannelRevisionRequest:
      properties:
        instructions:
          items:
            type: string
          type: array
          maxItems: 20
          minItems: 1
          title: Instructions
      additionalProperties: false
      type: object
      required:
      - instructions
      title: ChannelRevisionRequest
    ClarificationRequest:
      properties:
        answers:
          additionalProperties: true
          type: object
          title: Answers
      additionalProperties: false
      type: object
      required:
      - answers
      title: ClarificationRequest
    CreateTaskRequest:
      properties:
        title:
          type: string
          maxLength: 200
          minLength: 1
          title: Title
        selected_channels:
          items:
            $ref: '#/components/schemas/Channel'
          type: array
          minItems: 1
          title: Selected Channels
        brief:
          $ref: '#/components/schemas/BriefInput'
      additionalProperties: false
      type: object
      required:
      - title
      - selected_channels
      - brief
      title: CreateTaskRequest
    DecisionRequest:
      properties:
        content_version_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Content Version Id
        target_snapshot_hash:
          type: string
          maxLength: 128
          minLength: 32
          title: Target Snapshot Hash
        decision:
          type: string
          title: Decision
        comment:
          type: string
          maxLength: 4000
          minLength: 1
          title: Comment
      additionalProperties: false
      type: object
      required:
      - target_snapshot_hash
      - decision
      - comment
      title: DecisionRequest
    ExportRequest:
      properties:
        decision_id:
          type: string
          title: Decision Id
        target_snapshot_hash:
          type: string
          maxLength: 64
          minLength: 64
          title: Target Snapshot Hash
        formats:
          items:
            type: string
          type: array
          minItems: 1
          title: Formats
      additionalProperties: false
      type: object
      required:
      - decision_id
      - target_snapshot_hash
      title: ExportRequest
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    PreviewRequest:
      properties:
        decision_id:
          type: string
          title: Decision Id
        target_snapshot_hash:
          type: string
          maxLength: 64
          minLength: 64
          title: Target Snapshot Hash
      additionalProperties: false
      type: object
      required:
      - decision_id
      - target_snapshot_hash
      title: PreviewRequest
    SuccessResponse:
      properties:
        success:
          type: boolean
          title: Success
          default: true
        data:
          additionalProperties: true
          type: object
          title: Data
      additionalProperties: false
      type: object
      required:
      - data
      title: SuccessResponse
    Task:
      properties:
        task_id:
          type: string
        workspace_id:
          type: string
        user_id:
          type: string
        title:
          type: string
        status:
          $ref: '#/components/schemas/TaskStatus'
        selected_channels:
          items:
            $ref: '#/components/schemas/Channel'
          type: array
        current_node:
          type:
          - string
          - 'null'
        error:
