                contentVersionId:
                  type: string
                  title: Content Version Id
                baseRevision:
                  type: integer
                  title: Base Revision
      responses:
        '200':
          description: Applied (new revision returned)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '409':
          description: Revision moved; candidate parked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '404':
          description: Candidate not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
