  /api/v1/consumer/projects/{task_id}/draft/generate:
    post:
      summary: Generate Draft Candidate
      description: Run the draft generation graph (core idea + linked excerpts + base revision) and persist a master_revised candidate; the live draft is never overwritten automatically. Quota is reserved BEFORE the model call; exhausted quota returns 409 QUOTA_EXCEEDED while manual saving stays available.
      operationId: generate_draft_api_v1_consumer_projects__task_id__draft_generate_post
      security:
      - HTTPBearer: []
      parameters:
      - name: task_id
        in: path
        required: true
        schema:
          type: string
          title: Task Id
      - name: Idempotency-Key
        in: header
        required: false
        schema:
          type: string
          minLength: 8
          maxLength: 128
          title: Idempotency-Key
      responses:
        '200':
          description: Candidate ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '502':
          description: Provider failure; the draft is unchanged
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
  /api/v1/consumer/projects/{task_id}/draft/apply-candidate:
    post:
      summary: Apply Draft Candidate
      description: Second compare-and-swap; applies the candidate only if the draft revision has not moved since generation.
      operationId: apply_candidate_api_v1_consumer_projects__task_id__draft_apply_candidate_post
      security:
      - HTTPBearer: []
      parameters:
      - name: task_id
        in: path
