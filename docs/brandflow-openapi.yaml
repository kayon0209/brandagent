      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - document
              - baseRevision
              properties:
                document:
                  type: object
                  title: Document
                plainText:
                  type: string
                  title: Plain Text
                baseRevision:
                  type: integer
                  title: Base Revision
      responses:
        '200':
          description: Saved (new revision returned)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '409':
          description: Revision conflict; reload before retrying
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/consumer/projects/{task_id}/draft/adopt:
