name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  agent-api:
    name: agent-api (Python)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        working-directory: services/agent-api
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
      - name: Apply migrations
        working-directory: services/agent-api
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: |
          python - <<'PY'
          import os, glob
          from psycopg import connect
          dsn = os.environ["DATABASE_URL"]
          sql = ""
          for f in sorted(glob.glob("docs/migrations/*.sql")):
              sql += open(f, encoding="utf-8").read() + "\n"
          with connect(dsn) as conn:
              conn.execute(sql)
              conn.commit()
          print("migrations applied")
          PY
      - name: Test
        working-directory: services/agent-api
        run: pytest -q

  brand-tools-mcp:
    name: brand-tools-mcp (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        working-directory: services/brand-tools-mcp
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
      - name: Test
        working-directory: services/brand-tools-mcp
        run: pytest -q

  frontend:
    name: frontend contract tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: npm ci
      - name: Contract tests
        run: node --test tests/unit
