name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  agent-api:
    name: agent-api (Python)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
          # The service is reachable only from this ephemeral GitHub runner.
          # RLS tests intentionally reconnect as brandflow_app without a
          # password so they can prove it is a non-superuser, non-BYPASSRLS
          # business role rather than the postgres owner.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        working-directory: services/agent-api
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
      - name: Apply migrations
        working-directory: services/agent-api
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: |
          python - <<'PY'
          import os, glob
          from psycopg import connect
          dsn = os.environ["DATABASE_URL"]
          sql = ""
          migration_files = sorted(glob.glob("../../docs/migrations/*.sql"))
          grants_file = "../../docs/deployment/postgres-grants.sql"
          security_check_file = "../../tests/unit/security-definer-checks.sql"
          assert migration_files, "repository migrations were not found"
          assert os.path.isfile(grants_file), "repository grants were not found"
          assert os.path.isfile(security_check_file), "security-definer check was not found"
          for f in migration_files:
              sql += open(f, encoding="utf-8").read() + "\n"
          with connect(dsn) as conn:
              # 010 grants to brandflow_app and revokes from
              # brandflow_checkpoint.  Both roles must therefore exist before
              # any migration is parsed/executed, not after the batch.
              conn.execute("""
              DO $$
              BEGIN
                IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'brandflow_app') THEN
                  CREATE ROLE brandflow_app LOGIN NOSUPERUSER NOBYPASSRLS;
                END IF;
                IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'brandflow_checkpoint') THEN
                  CREATE ROLE brandflow_checkpoint LOGIN NOSUPERUSER NOBYPASSRLS;
                END IF;
              END
              $$;
              """)
              conn.execute("CREATE SCHEMA IF NOT EXISTS brandflow_checkpoint AUTHORIZATION brandflow_checkpoint")
              conn.execute("ALTER ROLE brandflow_checkpoint IN DATABASE postgres SET search_path TO brandflow_checkpoint")
              conn.execute(sql)
              grants_sql = "\n".join(line for line in open(grants_file, encoding="utf-8") if not line.lstrip().startswith("\\"))
              assert grants_sql.strip(), "repository grants were empty after removing psql meta-commands"
              conn.execute(grants_sql)
              security_check_sql = "\n".join(line for line in open(security_check_file, encoding="utf-8") if not line.lstrip().startswith("\\"))
              assert security_check_sql.strip(), "security-definer check was empty after removing psql meta-commands"
              conn.execute(security_check_sql)
              conn.commit()
          print("migrations, non-superuser business grants, and SECURITY DEFINER checks applied")
          PY
      - name: Test
        working-directory: services/agent-api
        env:
          RUN_AGENT_DB_TESTS: "true"
          AGENT_TEST_DATABASE_URL: postgresql://postgres@localhost:5432/postgres
        run: pytest -q

  brand-tools-mcp:
    name: brand-tools-mcp (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        working-directory: services/brand-tools-mcp
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
      - name: Test
        working-directory: services/brand-tools-mcp
        run: pytest -q

  frontend:
    name: frontend contract tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: |
          corepack enable
          pnpm install --frozen-lockfile
      - name: Quality gate
        # Format-valid placeholder (same policy as the Dockerfile build arg):
        # decodes to "docker-build-placeholder.clerk.example$". Clerk validates
        # key STRUCTURE at build time but never contacts the API during static
        # prerender, so the build passes reproducibly without secrets. Real
        # deployments inject their public key via environment/secrets.
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ZG9ja2VyLWJ1aWxkLXBsYWNlaG9sZGVyLmNsZXJrLmV4YW1wbGUk
        run: |
          pnpm run test:all
          pnpm run typecheck
          pnpm run lint
          pnpm run build
