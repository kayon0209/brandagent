services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: brandflow
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?set POSTGRES_ADMIN_PASSWORD}
      AGENT_DB_PASSWORD: ${AGENT_DB_PASSWORD:?set AGENT_DB_PASSWORD}
      CHECKPOINT_DB_PASSWORD: ${CHECKPOINT_DB_PASSWORD:?set CHECKPOINT_DB_PASSWORD}
    volumes:
      - brandflow-postgres:/var/lib/postgresql/data
      - ./docs/deployment/01-postgres-roles.sh:/docker-entrypoint-initdb.d/01-postgres-roles.sh:ro
      - ./docs/deployment/postgres-roles.sql:/opt/brandflow/postgres-roles.sql:ro
      - ./docs/migrations/001_init.sql:/docker-entrypoint-initdb.d/02-legacy.sql:ro
      - ./docs/migrations/002_brandflow_v2_foundation.sql:/docker-entrypoint-initdb.d/03-brandflow.sql:ro
      - ./docs/migrations/003_consumer_experience.sql:/docker-entrypoint-initdb.d/04-consumer.sql:ro
      - ./docs/migrations/004_consumer_rls.sql:/docker-entrypoint-initdb.d/05-consumer-rls.sql:ro
      - ./docs/migrations/005_consumer_rls_hardening.sql:/docker-entrypoint-initdb.d/06-consumer-rls-force.sql:ro
      - ./docs/migrations/006_style_reports.sql:/docker-entrypoint-initdb.d/07-style-reports.sql:ro
      - ./docs/migrations/007_style_report_enrichment.sql:/docker-entrypoint-initdb.d/08-style-report-enrichment.sql:ro
      - ./docs/migrations/008_consumer_material_kinds.sql:/docker-entrypoint-initdb.d/09-consumer-material-kinds.sql:ro
      - ./docs/migrations/009_deep_research.sql:/docker-entrypoint-initdb.d/10-deep-research.sql:ro
      - ./docs/migrations/010_deep_research_orphan_recovery.sql:/docker-entrypoint-initdb.d/11-orphan-recovery.sql:ro
      - ./docs/deployment/postgres-grants.sql:/docker-entrypoint-initdb.d/12-grants.sql:ro
      # upgrade path for EXISTING persistent volumes: docker-entrypoint only
      # runs on FIRST init, so missing 005–010 migrations must be applied to
      # an already-running stack explicitly in a maintenance window:
      #   docker compose exec postgres psql -U postgres -d brandflow \
      #     -v ON_ERROR_STOP=1 \
      #     -f /docker-entrypoint-initdb.d/09-consumer-material-kinds.sql
      #     -f /docker-entrypoint-initdb.d/10-deep-research.sql
      #     -f /docker-entrypoint-initdb.d/11-orphan-recovery.sql
      # (see docs/deployment/RUNBOOK.md — Database rules)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d brandflow"]
      interval: 5s
      timeout: 3s
      retries: 20

  brand-tools-mcp:
    build:
      context: .
      dockerfile: services/brand-tools-mcp/Dockerfile
    environment:
      BRAND_MCP_DATABASE_URL: postgresql://brandflow_app:${AGENT_DB_PASSWORD}@postgres:5432/brandflow
      BRAND_MCP_SERVICE_TOKEN: ${BRAND_MCP_SERVICE_TOKEN:?set BRAND_MCP_SERVICE_TOKEN}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8100/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 12

  # Public read-only edge (agentization P2): four read tools only; write and
  # high-risk tools are NOT REGISTERED in this process. Opt-in deployment —
  # `docker compose --profile public-mcp up` — so the default stack stays
  # closed to the outside.
  # Credential sources (factory refuses to boot with neither):
  #   a) static tokens: create brand-mcp-public-tokens.txt at the repo root
  #      ('<token> <workspace_id>' per line) BEFORE starting this service
  #   b) Clerk JWT: set BRAND_MCP_PUBLIC_CLERK_* — creators reuse their
  #      BrandAgent session token in external MCP clients
  brand-tools-mcp-public:
    build:
      context: .
      dockerfile: services/brand-tools-mcp/Dockerfile
    profiles: ["public-mcp"]
    command: ["uvicorn", "brand_tools_mcp.public_server:create_public_app", "--app-dir", "src", "--factory", "--host", "0.0.0.0", "--port", "8200"]
    environment:
      BRAND_MCP_DATABASE_URL: postgresql://brandflow_app:${AGENT_DB_PASSWORD}@postgres:5432/brandflow
      BRAND_MCP_SERVICE_TOKEN: ${BRAND_MCP_SERVICE_TOKEN:?set BRAND_MCP_SERVICE_TOKEN}
      BRAND_MCP_PUBLIC_TOKENS: /brand-mcp-public-tokens.txt
      BRAND_MCP_PUBLIC_CLERK_JWKS_URL: ${BRAND_MCP_PUBLIC_CLERK_JWKS_URL:-}
      BRAND_MCP_PUBLIC_CLERK_ISSUER: ${BRAND_MCP_PUBLIC_CLERK_ISSUER:-}
      BRAND_MCP_PUBLIC_CLERK_AUDIENCE: ${BRAND_MCP_PUBLIC_CLERK_AUDIENCE:-}
      BRAND_MCP_PUBLIC_CLERK_AUTHORIZED_PARTIES: ${BRAND_MCP_PUBLIC_CLERK_AUTHORIZED_PARTIES:-}
    volumes:
      # optional static credential table (read-only); required only when the
      # Clerk variables above are unset — the factory fail-closes otherwise
      - ./brand-mcp-public-tokens.txt:/brand-mcp-public-tokens.txt:ro
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      # loopback-bound by default; publish wider only behind a reverse
      # proxy with TLS (see RUNBOOK §Public read-only MCP edge)
      - "127.0.0.1:8200:8200"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8200/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 12

  agent-api:
    build:
      context: .
      dockerfile: services/agent-api/Dockerfile
    environment:
      ENVIRONMENT: production
      AGENT_DATABASE_URL: postgresql://brandflow_app:${AGENT_DB_PASSWORD}@postgres:5432/brandflow
      AGENT_CHECKPOINT_DATABASE_URL: postgresql://brandflow_checkpoint:${CHECKPOINT_DB_PASSWORD}@postgres:5432/brandflow
      BRAND_MCP_URL: http://brand-tools-mcp:8100/mcp
      BRAND_MCP_SERVICE_TOKEN: ${BRAND_MCP_SERVICE_TOKEN}
      GLM_API_KEY: ${GLM_API_KEY:?set GLM_API_KEY}
      GLM_MODEL: ${GLM_MODEL:-glm-4.7}
      # OpenAI-compatible gateway base URL (Zhipu BigModel default; Gitee AI etc. via env)
      GLM_BASE_URL: ${GLM_BASE_URL:-https://open.bigmodel.cn/api/paas/v4}
      CLERK_JWKS_URL: ${CLERK_JWKS_URL:?set CLERK_JWKS_URL}
      CLERK_ISSUER: ${CLERK_ISSUER:?set CLERK_ISSUER}
      CLERK_AUDIENCE: ${CLERK_AUDIENCE:-}
      CLERK_AUTHORIZED_PARTIES: ${CLERK_AUTHORIZED_PARTIES:-}
    depends_on:
      postgres:
        condition: service_healthy
      brand-tools-mcp:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 12

  web:
    build:
      context: .
      args:
        BRANDFLOW_AGENT_INTERNAL_URL: http://agent-api:8000
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:?set NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
    environment:
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:?set CLERK_SECRET_KEY}
      # Clerk middleware reads the publishable key at RUNTIME (dev-browser
      # detection / clerk proxy routing); the build-arg only satisfies
      # `next build`. Without this line the live stack rewrites protected
      # routes to a dangling /clerk_* proxy path and returns 404.
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:?set NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
      BRANDFLOW_AGENT_INTERNAL_URL: http://agent-api:8000
    depends_on:
      agent-api:
        condition: service_healthy
    ports:
      - "3000:3000"

volumes:
  brandflow-postgres:
